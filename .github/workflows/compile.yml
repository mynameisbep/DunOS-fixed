name: Compile Check

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile
        id: compile
        run: |
          set +e
          rm -rf out
          mkdir -p out
          SOURCES=$(find src -name "*.java" | sort)
          echo "Found $(echo "$SOURCES" | wc -l) source files"
          javac -d out -sourcepath src $SOURCES > compile.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Exit code: $EXIT_CODE"
          cat compile.log
          echo "---END---"
          cp compile.log full.log
      - name: Create gist with log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_CONTENT=$(cat full.log)
          if [ -z "$LOG_CONTENT" ]; then
            LOG_CONTENT="No errors - compilation succeeded (exit ${{ steps.compile.outputs.exit_code }})"
          fi
          echo "$LOG_CONTENT" > /tmp/content.txt
          jq -n --arg content "$(cat /tmp/content.txt)" '{description: "Compile log", public: false, files: {"compile.log": {content: $content}}}' > /tmp/gist.json
          curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/gists -d @/tmp/gist.json > /tmp/gist_resp.json
          cat /tmp/gist_resp.json
          GIST_ID=$(jq -r .id /tmp/gist_resp.json)
          echo "GIST_ID=$GIST_ID" >> $GITHUB_ENV
          echo "Gist created: $GIST_ID"
          echo "$GIST_ID" > GIST_ID.txt
          cat GIST_ID.txt
      - name: Save gist id to file and push
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add GIST_ID.txt
          git commit -m "Update gist id ${{ env.GIST_ID }}" || echo "no commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
