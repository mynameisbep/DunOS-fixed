name: Compile Check

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile
        id: compile
        run: |
          set +e
          rm -rf out
          mkdir -p out
          SOURCES=$(find src -name "*.java" | sort)
          echo "Found $(echo "$SOURCES" | wc -l) source files"
          javac -d out -sourcepath src $SOURCES > compile.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Exit code: $EXIT_CODE"
          cat compile.log
          echo "---END---"
          cp compile.log COMPILE_LOG.txt
          echo "Exit code: $EXIT_CODE" >> COMPILE_LOG.txt
      - name: Push log
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add COMPILE_LOG.txt
          git commit -m "Update compile log exit ${{ steps.compile.outputs.exit_code }}" || echo "no commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
